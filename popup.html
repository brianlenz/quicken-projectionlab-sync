<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quicken ProjectionLab Sync</title>
  <style>
    body {
      width: 500px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      box-sizing: border-box;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #333;
    }
    
    .status {
      padding: 12px;
      background-color: #f5f5f5;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    button:hover {
      background-color: #45a049;
    }
    
    button:active {
      background-color: #3d8b40;
    }

    .api-key-container {
      margin-bottom: 16px;
    }

    .file-input-container {
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #4CAF50;
    }

    input[type="file"] {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }

    input[type="file"]::-webkit-file-upload-button {
      padding: 6px 12px;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 3px;
      cursor: pointer;
    }

    input[type="file"]::-webkit-file-upload-button:hover {
      background-color: #e0e0e0;
    }

    .balances-container {
      margin-top: 16px;
      margin-bottom: 16px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      background-color: #fafafa;
      display: none;
    }

    .balances-container.visible {
      display: block;
    }

    .balances-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
    }

    .balance-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #e0e0e0;
      font-size: 13px;
    }

    .balance-item:last-child {
      border-bottom: none;
    }

    .balance-name {
      flex: 1;
      color: #555;
    }

    .balance-value {
      font-weight: 500;
      color: #333;
      margin-left: 12px;
    }
  </style>
</head>
<body>
  <h1>Quicken ProjectionLab Sync</h1>

  <div class="status">
    Status: <span id="status">Loading...</span>
  </div>

  <div class="api-key-container">
    <label class="input-label" for="api-key-input">ProjectionLab API Key:</label>
    <input type="password" id="api-key-input" placeholder="Enter your API key" />
  </div>

  <div class="file-input-container">
    <label class="input-label" for="file-input">Select Quicken Export File:</label>
    <input type="file" id="file-input" accept=".txt" />
  </div>

  <div id="balances-container" class="balances-container">
    <div class="balances-title">Loaded Account Balances:</div>
    <div id="balances-list"></div>
  </div>

  <button id="sync-button">Sync Data</button>

  <script src="popup.js"></script>
</body>
</html>
